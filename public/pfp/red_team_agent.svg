<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="red_team_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-207)">
  <defs>
    <radialGradient id="r-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#380612"/><stop offset="60%" stop-color="#210309"/><stop offset="100%" stop-color="#0a0003"/>
    </radialGradient>
    <linearGradient id="r-crimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/><stop offset="100%" stop-color="#990024"/>
    </linearGradient>
    <filter id="r-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <pattern id="ht-redteam" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#ff1744" opacity="0.45"/>
</pattern>
</defs>
  <rect width="500" height="500" rx="40" fill="url(#r-bg)" stroke="#ff0055" stroke-width="2"/>
  <circle cx="250" cy="230" r="160" fill="#ff0055" opacity="0.16" filter="url(#r-glow)"/>

  <g id="comic-halftone" opacity="0.5"><circle cx="384" cy="136" r="112" fill="url(#ht-redteam)"/><circle cx="96" cy="334" r="76" fill="url(#ht-redteam)"/></g>

  <g transform="translate(250, 240) scale(0.95)">
    <ellipse cx="0" cy="185" rx="90" ry="18" fill="#000000" opacity="0.55"/>
    
    <!-- Razor Red Horns / Threat Emblems -->
    <polygon points="-46,-90 -74,-130 -30,-98" fill="#800318" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="46,-90 74,-130 30,-98" fill="#800318" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Head &amp; Ears -->
    <rect x="-96" y="-55" width="24" height="42" rx="10" fill="#d90429" stroke="#000000" stroke-width="8.5"/>
    <rect x="72" y="-55" width="24" height="42" rx="10" fill="#d90429" stroke="#000000" stroke-width="8.5"/>
    <polygon points="-86,-66 -56,-95 56,-95 86,-66 86,-14 56,25 -56,25 -86,-14" fill="url(#r-crimson)" stroke="#000000" stroke-width="11" stroke-linejoin="round"/>

    <!-- Sinister Angled Pentest Eyes -->
    <rect x="-65" y="-55" width="130" height="62" rx="18" fill="#140206" stroke="#000000" stroke-width="8"/>
    <g transform="rotate(14 -28 -24)">
      <polygon points="-38,-30 -16,-22 -18,-14 -40,-22" fill="#ff1744" filter="url(#r-glow)"/>
      <circle cx="-29" cy="-23" r="3.5" fill="#ffffff"/>
    </g>
    <g transform="rotate(-14 28 -24)">
      <polygon points="16,-22 38,-30 40,-22 18,-14" fill="#ff1744" filter="url(#r-glow)"/>
      <circle cx="25" cy="-23" r="3.5" fill="#ffffff"/>
    </g>
    <path d="M -42,-40 L -16,-33" stroke="#ff5277" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 42,-40 L 16,-33" stroke="#ff5277" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -15,-6 L -8,-2 L 0,-8 L 8,-2 L 15,-6" fill="none" stroke="#ff5277" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso with Cyber Lightning Bolt Attack Glyph -->
    <polygon points="-66,30 -46,18 -50,42" fill="#800318" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="66,30 46,18 50,42" fill="#800318" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -52,22 C -66,58 -56,118 0,144 C 56,118 66,58 52,22 Z" fill="url(#r-crimson)" stroke="#000000" stroke-width="11"/>
    <polygon points="4,42 -12,80 0,80 -6,116 16,72 2,72 10,42" fill="#080002" stroke="#000000" stroke-width="3"/>
    <line x1="-2" y1="52" x2="6" y2="72" stroke="#ff0055" stroke-width="3" stroke-linecap="round" filter="url(#r-glow)"/>
  </g>
  <rect x="86" y="436" width="329" height="31" rx="15.5" fill="#0b111c" opacity="0.88" stroke="#ff1744" stroke-width="2.5" filter="url(#r-glow)"/>
  <text x="250" y="455" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">RED TEAM // ADVERSARY SIM</text>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(118,148) scale(0.9)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ff1744" opacity="0.9" transform="translate(392,112) scale(1.15)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ff1744" opacity="0.75" transform="translate(402,318) scale(0.75)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(103,332) scale(0.6)"/>
</g>
<g stroke="#ff1744" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="292" y1="70" x2="316" y2="52"/>
  <line x1="300" y1="86" x2="326" y2="72"/>
  <line x1="304" y1="104" x2="330" y2="94"/>
</g>
</g></g>
</svg>
