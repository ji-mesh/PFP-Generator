<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="man1 portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(2.1) translate(-210,-192)">
  <defs>
    <linearGradient id="m_cubeTop" gradientUnits="userSpaceOnUse" x1="-120" y1="-140" x2="120" y2="0">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="m_cubeLeft" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="0" y2="140">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="m_cubeRight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="122" y2="140">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="m_extrude" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="122" y2="70">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="m_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="m_glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.26"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ht-man" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#f59e0b" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Comic Halftone Patches -->
  <g opacity="0.45">
    <circle cx="332" cy="122" r="78" fill="url(#ht-man)"/>
    <circle cx="92" cy="302" r="54" fill="url(#ht-man)"/>
  </g>

  <g id="male-engineer" transform="translate(210, 212)">
    <!-- Kontakt-Schatten -->
    <ellipse cx="0" cy="170" rx="105" ry="14" fill="#000000" opacity="0.35"/>

    <!-- Screen Glow -->
    <polygon points="-70,110 70,110 92,-16 -92,-16" fill="url(#m_glow)"/>

    <!-- Tee-Torso -->
    <path d="M -66,150 C -76,106 -50,72 -28,64 L 28,64 C 50,72 76,106 66,150 Z" fill="#18181b" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -20,66 C -12,80 12,80 20,66 Z" fill="#27272a" stroke="#000000" stroke-width="5"/>

    <!-- Sunset JiMesh Cube auf dem Shirt -->
    <g transform="translate(0, 114) scale(0.115)">
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
      <g transform="translate(18,20)"><polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="url(#m_extrude)"/></g>
      <polygon points="0,-140 122,-70 0,0 -122,-70" fill="url(#m_cubeTop)"/>
      <polygon points="-122,-70 0,0 0,140 -122,70" fill="url(#m_cubeLeft)"/>
      <polygon points="0,0 122,-70 122,70 0,140" fill="url(#m_cubeRight)"/>
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>
    </g>

    <!-- Ärmel -->
    <path d="M -60,84 C -66,108 -58,126 -38,138" fill="none" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
    <path d="M 60,84 C 66,108 58,126 38,138" fill="none" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>

    <!-- Hals -->
    <rect x="-13" y="28" width="26" height="40" rx="8" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>

    <!-- Kopf -->
    <rect x="-44" y="-54" width="88" height="96" rx="30" fill="#fcd9ae" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="-44" cy="-8" r="10" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <circle cx="44" cy="-8" r="10" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>

    <!-- Kinn-Stoppeln -->
    <path d="M -28,28 Q 0,42 28,28" fill="none" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" stroke-dasharray="2.5 5.5" opacity="0.6"/>

    <!-- Gekämmte kurze Haare -->
    <path d="M -46,-16 C -50,-58 50,-58 46,-16 C 38,-30 22,-38 0,-36 C -20,-38 -38,-30 -46,-16 Z" fill="#27272a" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -38,-36 C -20,-46 18,-46 36,-34" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Comic-Gesicht -->
    <path d="M -24,-22 Q -17,-26 -10,-22" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10,-22 Q 17,-26 24,-22" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-17" cy="-9" rx="5.5" ry="6.5" fill="#ffffff"/>
    <ellipse cx="17" cy="-9" rx="5.5" ry="6.5" fill="#ffffff"/>
    <circle cx="-16.5" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="17.5" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="-18.5" cy="-11" r="1.5" fill="#ffffff"/>
    <circle cx="15.5" cy="-11" r="1.5" fill="#ffffff"/>
    <ellipse cx="-31" cy="4" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.7"/>
    <ellipse cx="31" cy="4" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.7"/>
    <path d="M -10,16 Q 0,26 10,16" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M -10,16 Q 0,23 10,16 Q 0,19.5 -10,16 Z" fill="#7f1d1d"/>

    <!-- Amber Headset mit Mikrofon -->
    <path d="M -46,-12 C -52,-66 52,-66 46,-12" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <rect x="-56" y="-20" width="14" height="26" rx="6" fill="#f59e0b" stroke="#000000" stroke-width="6"/>
    <rect x="42" y="-20" width="14" height="26" rx="6" fill="#f59e0b" stroke="#000000" stroke-width="6"/>
    <path d="M 46,4 L 30,16 L 18,16" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="15" cy="16" r="4" fill="#fbbf24" stroke="#000000" stroke-width="2.5"/>

    <!-- Laptop -->
    <g id="frontal-laptop-male" transform="translate(0, 118)">
      <polygon points="-64,-26 64,-26 74,36 -74,36" fill="url(#m_screen)" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="-58,-20 58,-20 67,30 -67,30" fill="#1e293b"/>
      <g transform="translate(0, 4) scale(0.12)">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
        <g transform="translate(18,20)"><polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="url(#m_extrude)"/></g>
        <polygon points="0,-140 122,-70 0,0 -122,-70" fill="url(#m_cubeTop)"/>
        <polygon points="-122,-70 0,0 0,140 -122,70" fill="url(#m_cubeLeft)"/>
        <polygon points="0,0 122,-70 122,70 0,140" fill="url(#m_cubeRight)"/>
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>
      </g>
      <polygon points="-76,34 76,34 90,52 -90,52" fill="#0b101c" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <line x1="-52" y1="40" x2="52" y2="40" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <rect x="-15" y="44" width="30" height="6" rx="2" fill="#1e293b"/>
    </g>

    <!-- Hände auf der Tastatur -->
    <circle cx="-32" cy="149" r="9.5" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <circle cx="32" cy="149" r="9.5" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <path d="M -38,146 L -27,146" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 27,146 L 38,146" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Comic Sparkles -->
  <g id="comic-sparkles">
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(86,120) scale(0.8)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#f59e0b" opacity="0.9" transform="translate(338,88) scale(1.0)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#f59e0b" opacity="0.7" transform="translate(342,296) scale(0.65)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(80,300) scale(0.55)"/>
  </g>
</g></g>
</svg>
