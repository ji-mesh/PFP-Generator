<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="voice_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-207)">
  <defs>
    <radialGradient id="v-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b200b"/><stop offset="60%" stop-color="#241204"/><stop offset="100%" stop-color="#0d0601"/>
    </radialGradient>
    <linearGradient id="v-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <pattern id="ht-voice" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#f59e0b" opacity="0.45"/>
</pattern>
</defs>
  <rect width="500" height="500" rx="40" fill="url(#v-bg)" stroke="#b45309" stroke-width="2"/>
  <circle cx="250" cy="230" r="160" fill="#f59e0b" opacity="0.15" filter="url(#v-glow)"/>

  <g id="comic-halftone" opacity="0.5"><circle cx="384" cy="136" r="112" fill="url(#ht-voice)"/><circle cx="96" cy="334" r="76" fill="url(#ht-voice)"/></g>

  <g transform="translate(250, 240) scale(0.95)">
    <ellipse cx="0" cy="185" rx="90" ry="18" fill="#000000" opacity="0.55"/>
    <!-- Audio Wave Halo on Head -->
    <path d="M -45,-155 C -30,-180 30,-180 45,-155" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" filter="url(#v-glow)"/>
    <path d="M -30,-140 C -20,-160 20,-160 30,-140" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="-145" r="20" fill="#f59e0b" stroke="#000000" stroke-width="8"/>

    <!-- Over-Ear Headset on Ears -->
    <rect x="-102" y="-62" width="22" height="48" rx="11" fill="#0284c7" stroke="#000000" stroke-width="8"/>
    <line x1="-91" y1="-50" x2="-91" y2="-26" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <rect x="80" y="-62" width="22" height="48" rx="11" fill="#0284c7" stroke="#000000" stroke-width="8"/>
    <line x1="91" y1="-50" x2="91" y2="-26" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <!-- Microphone Arm -->
    <path d="M 85,-35 L 45,5 L 18,5" fill="none" stroke="#000000" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="14" cy="5" r="7" fill="#f59e0b" stroke="#000000" stroke-width="2.5" filter="url(#v-glow)"/>

    <!-- Head -->
    <rect x="-86" y="-95" width="172" height="120" rx="50" fill="url(#v-amber)" stroke="#000000" stroke-width="11"/>
    <rect x="-65" y="-55" width="130" height="62" rx="18" fill="#2d1405" stroke="#000000" stroke-width="8"/>
    <circle cx="-28" cy="-24" r="12" fill="#fef08a" filter="url(#v-glow)"/><circle cx="28" cy="-24" r="12" fill="#fef08a" filter="url(#v-glow)"/>
    <circle cx="-32" cy="-28" r="4" fill="#ffffff" opacity="0.95"/><circle cx="-24" cy="-20" r="2" fill="#ffffff" opacity="0.8"/><circle cx="24" cy="-28" r="4" fill="#ffffff" opacity="0.95"/><circle cx="32" cy="-20" r="2" fill="#ffffff" opacity="0.8"/>
    <path d="M -42,-41 Q -29,-48 -16,-42" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 16,-42 Q 29,-48 42,-41" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -13,-9 Q 0,3 13,-9 Q 0,-4 -13,-9 Z" fill="#2d1405" stroke="#fef08a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -5,-7.5 L 5,-7.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Chest with Audio Visualizer Bars -->
    <path d="M -52,22 C -66,58 -56,118 0,144 C 56,118 66,58 52,22 Z" fill="url(#v-amber)" stroke="#000000" stroke-width="11"/>
    <ellipse cx="0" cy="153" rx="56" ry="10" fill="#1a0d02" stroke="#000000" stroke-width="6"/>
    <ellipse cx="0" cy="153" rx="30" ry="5" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g transform="translate(0, 80)">
      <rect x="-30" y="-12" width="8" height="24" rx="3" fill="#fef08a"/>
      <rect x="-18" y="-20" width="8" height="40" rx="3" fill="#fef08a"/>
      <rect x="-6" y="-28" width="8" height="56" rx="3" fill="#ffffff" filter="url(#v-glow)"/>
      <rect x="6" y="-18" width="8" height="36" rx="3" fill="#fef08a"/>
      <rect x="18" y="-10" width="8" height="20" rx="3" fill="#fef08a"/>
    </g>
  </g>
  <rect x="86" y="436" width="329" height="31" rx="15.5" fill="#0b111c" opacity="0.88" stroke="#f59e0b" stroke-width="2.5" filter="url(#v-glow)"/>
  <text x="250" y="455" fill="#fef08a" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">VOICE AGENT // WEBRTC SIP</text>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(118,148) scale(0.9)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#f59e0b" opacity="0.9" transform="translate(392,112) scale(1.15)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#f59e0b" opacity="0.75" transform="translate(402,318) scale(0.75)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(103,332) scale(0.6)"/>
</g>
<g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="292" y1="70" x2="316" y2="52"/>
  <line x1="300" y1="86" x2="326" y2="72"/>
  <line x1="304" y1="104" x2="330" y2="94"/>
</g>
</g></g>
</svg>
