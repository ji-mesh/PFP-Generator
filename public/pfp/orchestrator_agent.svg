<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="orchestrator_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-207)">
  <defs>
    <radialGradient id="o-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2a33"/><stop offset="60%" stop-color="#07161d"/><stop offset="100%" stop-color="#02070b"/>
    </radialGradient>
    <linearGradient id="o-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="o-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <pattern id="ht-orch" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.45"/>
</pattern>
</defs>
  <rect width="500" height="500" rx="40" fill="url(#o-bg)" stroke="#155e75" stroke-width="2"/>
  <circle cx="250" cy="230" r="160" fill="#22d3ee" opacity="0.15" filter="url(#o-glow)"/>

  <g id="comic-halftone" opacity="0.5"><circle cx="384" cy="136" r="112" fill="url(#ht-orch)"/><circle cx="96" cy="334" r="76" fill="url(#ht-orch)"/></g>

  <g transform="translate(250, 240) scale(0.95)">
    <!-- Base Contact Shadow -->
    <ellipse cx="0" cy="185" rx="95" ry="18" fill="#000000" opacity="0.55"/>

    <!-- Beacon Antenna -->
    <line x1="0" y1="-85" x2="0" y2="-140" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-155" r="24" fill="#22d3ee" stroke="#000000" stroke-width="9" filter="url(#o-glow)"/>
    <circle cx="-7" cy="-162" r="6" fill="#ffffff" opacity="0.9"/>

    <!-- ===== LINKER ARM: erhoben, offene Hand (Dirigent) ===== -->
    <path d="M -46,28 C -68,26 -82,20 -88,4 C -93,-9 -93,-30 -89,-44" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
    <path d="M -46,28 C -68,26 -82,20 -88,4 C -93,-9 -93,-30 -89,-44" fill="none" stroke="#0e7490" stroke-width="15" stroke-linecap="round"/>
    <circle cx="-89" cy="-50" r="13" fill="#0284c7" stroke="#000000" stroke-width="6"/>
    <!-- Broadcast-Pulse aus der linken Hand -->
    <path d="M -104,-64 A 22,22 0 0 1 -76,-70" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M -112,-72 A 34,34 0 0 1 -68,-80" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.05;0.7;0.05" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>

    <!-- ===== RECHTER ARM: erhoben mit Zeigestab ===== -->
    <path d="M 46,28 C 68,26 82,20 88,4 C 93,-9 93,-30 89,-44" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
    <path d="M 46,28 C 68,26 82,20 88,4 C 93,-9 93,-30 89,-44" fill="none" stroke="#0e7490" stroke-width="15" stroke-linecap="round"/>
    <circle cx="89" cy="-50" r="13" fill="#0284c7" stroke="#000000" stroke-width="6"/>
    <!-- Zeigestab (dirigiert, winkt leicht) -->
    <g transform="rotate(0 89 -50)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="-6 89 -50; 7 89 -50; -6 89 -50" dur="1.6s" repeatCount="indefinite"/>
      <line x1="91" y1="-56" x2="128" y2="-112" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
      <line x1="91" y1="-56" x2="128" y2="-112" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
      <circle cx="128" cy="-112" r="5" fill="#67e8f9" filter="url(#o-glow)"/>
    </g>

    <!-- ===== KOPF / CHASSIS ===== -->
    <rect x="-96" y="-55" width="24" height="42" rx="10" fill="#0e7490" stroke="#000000" stroke-width="8.5"/>
    <rect x="72" y="-55" width="24" height="42" rx="10" fill="#0e7490" stroke="#000000" stroke-width="8.5"/>
    <rect x="-86" y="-95" width="172" height="120" rx="14" fill="url(#o-blue)" stroke="#000000" stroke-width="11"/>
    <circle cx="-74" cy="-83" r="3.5" fill="#081b2e" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="74" cy="-83" r="3.5" fill="#081b2e" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="-74" cy="13" r="3.5" fill="#081b2e" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="74" cy="13" r="3.5" fill="#081b2e" stroke="#22d3ee" stroke-width="1.5"/>

    <!-- Visor mit Hub-and-Spoke Netz-Augen -->
    <rect x="-65" y="-55" width="130" height="62" rx="18" fill="#081b2e" stroke="#000000" stroke-width="8"/>
    <rect x="-58" y="-48" width="116" height="48" rx="12" fill="#051524" stroke="#22d3ee" stroke-width="3"/>
    <line x1="-26" y1="-24" x2="26" y2="-24" stroke="#67e8f9" stroke-width="3" opacity="0.85"/>
    <line x1="-26" y1="-24" x2="0" y2="-24" stroke="#67e8f9" stroke-width="3" opacity="0.6"/>
    <circle cx="-28" cy="-24" r="10" fill="#67e8f9" filter="url(#o-glow)"/>
    <circle cx="28" cy="-24" r="10" fill="#67e8f9" filter="url(#o-glow)"/>
    <circle cx="0" cy="-24" r="5" fill="#22d3ee">
      <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-31" cy="-27" r="3" fill="#ffffff" opacity="0.95"/>
    <circle cx="25" cy="-27" r="3" fill="#ffffff" opacity="0.95"/>

    <!-- ===== TORSO: Anzug mit weissem Hemd-V und Fliege ===== -->
    <path d="M -52,22 C -66,58 -56,118 0,144 C 56,118 66,58 52,22 Z" fill="url(#o-blue)" stroke="#000000" stroke-width="11"/>
    <!-- Weisses Hemd-V -->
    <polygon points="-17,24 17,24 0,60" fill="#e2e8f0" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Schwarze Fliege -->
    <polygon points="-19,22 -4,29 -19,36" fill="#0a0d12" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="19,22 4,29 19,36" fill="#0a0d12" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="29" r="4.5" fill="#0a0d12" stroke="#000000" stroke-width="3"/>
    <!-- Task-Dispatch-Linien rechts -->
    <line x1="22" y1="66" x2="46" y2="66" stroke="#081b2e" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="18" y1="82" x2="46" y2="82" stroke="#081b2e" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="22" y1="98" x2="46" y2="98" stroke="#081b2e" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="18" y1="114" x2="46" y2="114" stroke="#081b2e" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <rect x="92" y="436" width="317" height="31" rx="15.5" fill="#0b111c" opacity="0.88" stroke="#22d3ee" stroke-width="2.5" filter="url(#o-glow)"/>
  <text x="250" y="455" fill="#cffafe" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">ORCHESTRATOR AGENT</text>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(118,148) scale(0.9)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.9" transform="translate(392,112) scale(1.15)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.75" transform="translate(402,318) scale(0.75)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(103,332) scale(0.6)"/>
</g>
<g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="292" y1="70" x2="316" y2="52"/>
  <line x1="300" y1="86" x2="326" y2="72"/>
  <line x1="304" y1="104" x2="330" y2="94"/>
</g>
</g></g>
</svg>
