<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="analyst avatar, holding tablet with chart, circular crop">
  <defs>
    <clipPath id="anaClip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="anaGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="anaDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#c084fc" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#anaClip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#anaGlow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#anaDots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#anaDots)"/>
    </g>
    <g id="ana-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- bob back panel -->
      <rect x="-52" y="-54" width="104" height="64" rx="24" fill="#4a3580" stroke="#000000" stroke-width="7"/>
      <!-- torso turtleneck -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#151b2e" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <rect x="-20" y="56" width="40" height="16" rx="8" fill="#1f2740" stroke="#000000" stroke-width="5"/>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#eec1a2" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#eec1a2" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#eec1a2" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#eec1a2" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- square glasses (cyan) -->
      <rect x="-31" y="-62" width="26" height="20" rx="5" fill="#0a0d17" fill-opacity="0.5" stroke="#22d3ee" stroke-width="4"/>
      <rect x="5" y="-62" width="26" height="20" rx="5" fill="#0a0d17" fill-opacity="0.5" stroke="#22d3ee" stroke-width="4"/>
      <path d="M -5,-54 L 5,-54" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <!-- bob fringe -->
      <path d="M -46,-56 C -48,-116 48,-116 46,-56 C 46,-72 24,-80 0,-80 C -24,-80 -46,-72 -46,-56 Z" fill="#4a3580" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      </g>
      <!-- tablet -->
      <rect x="-34" y="96" width="68" height="50" rx="8" fill="#0e1a2b" stroke="#000000" stroke-width="6"/>
      <rect x="-28" y="102" width="56" height="38" rx="4" fill="#101c30"/>
      <rect x="-20" y="124" width="8" height="12" fill="#22d3ee" stroke="#000000" stroke-width="2"/>
      <rect x="-8" y="116" width="8" height="20" fill="#67e8f9" stroke="#000000" stroke-width="2"/>
      <rect x="4" y="110" width="8" height="26" fill="#c084fc" stroke="#000000" stroke-width="2"/>
      <polyline points="-20,112 -6,104 8,108 18,100" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- hands -->
      <circle cx="-36" cy="130" r="9" fill="#eec1a2" stroke="#000000" stroke-width="5"/>
      <circle cx="36" cy="130" r="9" fill="#eec1a2" stroke="#000000" stroke-width="5"/>
    </g>
    <g id="ana-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#00d2ff" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
