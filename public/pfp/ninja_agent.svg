<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="ninja_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-204)">
  <defs>
    <radialGradient id="nj-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#131a2b"/><stop offset="60%" stop-color="#0a0f1c"/><stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="nj-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1233"/><stop offset="100%" stop-color="#0b0a1a"/>
    </linearGradient>
    <linearGradient id="nj-blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="nj-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="nj-ht" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#a78bfa" opacity="0.4"/>
    </pattern>
    <filter id="nj-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Comic Halftone -->
  <g opacity="0.5"><circle cx="384" cy="130" r="105" fill="url(#nj-ht)"/><circle cx="92" cy="330" r="70" fill="url(#nj-ht)"/></g>

  <g id="ninja-agent" transform="translate(250, 240)">
    <!-- Kontakt-Schatten -->
    <ellipse cx="0" cy="175" rx="60" ry="12" fill="#000000" opacity="0.4"/>

    <!-- Katana (hinter dem Rücken) -->
    <g transform="translate(6, 26) rotate(38)">
      <rect x="-165" y="6" width="216" height="11" rx="5.5" fill="url(#nj-blade)" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="-169,11.5 -141,6 -141,17" fill="#94a3b8" stroke="#000000" stroke-width="3"/>
      <rect x="51" y="0" width="76" height="23" rx="8" fill="#1f1633" stroke="#000000" stroke-width="4"/>
      <circle cx="132" cy="11.5" r="5" fill="#a78bfa" stroke="#000000" stroke-width="2.5"/>
    </g>

    <!-- Ninja-Stirnband mit wehenden Bandenden (flattern) -->
    <g>
      <path d="M -86,-70 C -40,-84 40,-84 86,-70 L 86,-46 C 40,-58 -40,-58 -86,-46 Z" fill="url(#nj-band)" stroke="#000000" stroke-width="7.5" stroke-linejoin="round"/>
      <!-- Bandenden links (flattern) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 -86 -58; 5 -86 -58; -6 -86 -58" dur="1.6s" repeatCount="indefinite"/>
        <path d="M -86,-58 C -110,-62 -126,-56 -142,-44 C -124,-40 -104,-42 -86,-46 Z" fill="url(#nj-band)" stroke="#000000" stroke-width="6.5" stroke-linejoin="round"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="4 -86 -52; -5 -86 -52; 4 -86 -52" dur="1.9s" repeatCount="indefinite"/>
        <path d="M -86,-52 C -106,-48 -120,-40 -132,-26 C -114,-26 -98,-34 -86,-46 Z" fill="#4c1d95" stroke="#000000" stroke-width="6.5" stroke-linejoin="round"/>
      </g>
      <!-- Knoten + Metalldose rechts -->
      <circle cx="88" cy="-58" r="7" fill="#a78bfa" stroke="#000000" stroke-width="4"/>
    </g>

    <!-- Ohren / Sensor Caps (Ninja-Kapuzenkanten) -->
    <polygon points="-88,-92 -108,-72 -88,-62" fill="#1f2937" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="88,-92 108,-72 88,-62" fill="#1f2937" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>

    <!-- Roboter-Kopf (Obsidian Chassis) -->
    <rect x="-82" y="-92" width="164" height="112" rx="30" fill="#111827" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>

    <!-- Ninja-Masken-Schlitz (Visor) -->
    <rect x="-62" y="-54" width="124" height="60" rx="16" fill="url(#nj-visor)" stroke="#000000" stroke-width="7.5"/>
    <rect x="-56" y="-48" width="112" height="48" rx="11" fill="#0d0a1d" stroke="#4c1d95" stroke-width="4.5"/>

    <!-- Scharfe Ninja-Augen (violettes Glühen) -->
    <g transform="rotate(10 -28 -24)" filter="url(#nj-glow)">
      <polygon points="-38,-30 -16,-22 -18,-14 -40,-22" fill="#a78bfa"/>
      <ellipse cx="-27" cy="-22" rx="8" ry="4" fill="#ddd6fe"/>
      <circle cx="-29" cy="-23" r="2.5" fill="#ffffff"/>
    </g>
    <g transform="rotate(-10 28 -24)" filter="url(#nj-glow)">
      <polygon points="16,-22 38,-30 40,-22 18,-14" fill="#a78bfa"/>
      <ellipse cx="27" cy="-22" rx="8" ry="4" fill="#ddd6fe"/>
      <circle cx="25" cy="-23" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Torso (Obsidian, Kapuzenkragen) -->
    <polygon points="-66,28 -46,16 -52,38" fill="#1f2937" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="66,28 46,16 52,38" fill="#1f2937" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -48,22 C -62,56 -52,112 0,136 C 52,112 62,56 48,22 C 34,25 -34,25 -48,22 Z" fill="#111827" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 0,136 C 36,120 54,82 48,22 C 34,25 24,32 20,46 C 14,70 18,108 0,136 Z" fill="#0b1120"/>

    <!-- Kapuzen-Kragen (Schal) -->
    <path d="M -48,22 C -30,38 30,38 48,22 C 40,34 30,44 0,44 C -30,44 -40,34 -48,22 Z" fill="#4c1d95" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

    <!-- Brust-Badge: rotierender Shuriken -->
    <g transform="translate(0, 80)">
      <circle cx="0" cy="0" fill="#04040a" r="28" stroke="#000000" stroke-width="4"></circle>
      <circle cx="0" cy="0" fill="#160f2b" r="24" stroke="#6d28d9" stroke-width="2.5"></circle>
      <g filter="url(#nj-glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
        <path fill="#cbd5e1" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" d="M 0,-19 L 5,-5 L 19,0 L 5,5 L 0,19 L -5,5 L -19,0 L -5,-5 Z"/>
        <circle cx="0" cy="0" r="5" fill="#a78bfa" stroke="#000000" stroke-width="2"/>
      </g>
    </g>

    <!-- Arme / Greifer (eine Hand formt Ninjazeichen) -->
    <path d="M -54,34 C -68,44 -74,60 -64,70 C -54,78 -46,64 -46,54" fill="#0b1120" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -68,54 C -78,60 -70,76 -58,72" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 54,34 C 68,44 74,60 64,70 C 54,78 46,64 46,54" fill="#0b1120" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 68,54 C 78,60 70,76 58,72" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Glitch-Partikel (Schatten-Püş) -->
    <circle cx="-52" cy="18" r="3" fill="#a78bfa"/>
    <circle cx="56" cy="12" r="2.5" fill="#a78bfa"/>
  </g>

  <!-- Comic Sparkles -->
  <g>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(90,110) scale(0.8)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#a78bfa" opacity="0.85" transform="translate(408,96) scale(1.0)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#a78bfa" opacity="0.7" transform="translate(410,300) scale(0.7)"/>
  </g>
  <!-- Rauch-Wölkchen (Ninja-Teleport) -->
  <g fill="#4c1d95" opacity="0.5">
    <circle cx="120" cy="400" r="10"/><circle cx="140" cy="408" r="7"/><circle cx="105" cy="408" r="6"/>
  </g>
</g></g>
</svg>
