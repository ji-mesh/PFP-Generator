<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="qa avatar, quality engineer with shield-check badge, circular crop">
  <defs>
    <clipPath id="qaiClip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="qaiGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="qaiDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#qaiClip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#qaiGlow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#qaiDots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#qaiDots)"/>
    </g>
    <g id="qai-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- torso hoodie -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#161327" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- hood behind neck -->
      <path d="M -40,60 C -46,44 -20,36 0,36 C 20,36 46,44 40,60 C 24,52 -24,52 -40,60 Z" fill="#1d1834" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <!-- drawstrings -->
      <path d="M -8,72 L -10,104" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <path d="M 8,72 L 10,104" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-10" cy="108" r="3.5" fill="#c084fc"/>
      <circle cx="10" cy="108" r="3.5" fill="#c084fc"/>
      <!-- shield-check badge -->
      <g transform="translate(0,124)">
        <path d="M 0,-26 L 20,-18 L 20,2 C 20,16 10,26 0,30 C -10,26 -20,16 -20,2 L -20,-18 Z" fill="#101c30" stroke="#000000" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M -9,0 L -2,8 L 11,-10" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#e8b48a" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#e8b48a" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#e8b48a" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#e8b48a" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.7"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.7"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- square glasses (violet) -->
      <rect x="-31" y="-62" width="26" height="20" rx="5" fill="#0a0d17" fill-opacity="0.5" stroke="#c084fc" stroke-width="4"/>
      <rect x="5" y="-62" width="26" height="20" rx="5" fill="#0a0d17" fill-opacity="0.5" stroke="#c084fc" stroke-width="4"/>
      <path d="M -5,-54 L 5,-54" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <!-- short hair -->
      <path d="M -46,-52 C -48,-108 48,-108 46,-52 C 40,-74 -40,-74 -46,-52 Z" fill="#2e2640" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="qai-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
