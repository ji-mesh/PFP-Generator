<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="man3 portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(2.7) translate(-210,-184)">
  <defs>
    <linearGradient id="hck_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2a1c"/><stop offset="100%" stop-color="#050d0a"/>
    </linearGradient>
    <filter id="hck_soft" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="hck_eyeglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur result="blur" stdDeviation="5"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ht-hck" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#ff0055" opacity="0.35"/>
      <circle cx="9" cy="9" r="1.2" fill="#ff0055" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Roter Comic-Halftone-Hintergrund -->
  <g opacity="0.5">
    <circle cx="332" cy="122" r="78" fill="url(#ht-hck)"/>
    <circle cx="92" cy="302" r="54" fill="url(#ht-hck)"/>
  </g>

  <g id="human-hacker" transform="translate(210, 212)">
    <!-- Kontakt-Schatten -->
    <ellipse cx="0" cy="102" rx="74" ry="11" fill="#000000" opacity="0.32"/>

    <!-- Sanfter Laptop-Glow (rot) -->
    <circle cx="0" cy="86" r="54" fill="#ef4444" opacity="0.10"/>

    <!-- Roter Glitch-Regen hinter der Figur -->
    <g id="glitch-rain" aria-hidden="true">
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate" values="-100,-60; -100,40; -100,-60" dur="5.2s" repeatCount="indefinite"/>
        <rect x="-100" y="-64" width="4" height="9" rx="2" fill="#ff0055" opacity="0.9"/>
        <rect x="-100" y="-50" width="4" height="7" rx="2" fill="#ff0055" opacity="0.55"/>
        <rect x="-100" y="-36" width="4" height="8" rx="2" fill="#990024" opacity="0.6"/>
      </g>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate" values="104,-52; 104,36; 104,-52" dur="4.3s" repeatCount="indefinite"/>
        <rect x="104" y="-58" width="4" height="8" rx="2" fill="#ff0055" opacity="0.9"/>
        <rect x="104" y="-44" width="4" height="10" rx="2" fill="#990024" opacity="0.55"/>
        <rect x="104" y="-28" width="4" height="7" rx="2" fill="#ff0055" opacity="0.7"/>
      </g>
    </g>

    <!-- ================= SPY-BUST: DIE FORM AUS DEM ICON, REIN SCHWARZ ================= -->
    <g id="spy-bust" transform="scale(1.06)">
      <!-- Brust/Mantel-Korpus mit flachem Schnitt unten -->
      <path d="M -26,-10 C -12,-3 12,-3 26,-10 L 30,14 C 34,32 44,44 62,50 C 32,58 -32,58 -62,50 C -44,44 -34,32 -30,14 Z"
            fill="#0a0d12" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>

      <!-- Mantel-Kragen: zwei Flaps, Spitzen zeigen nach AUSSEN-OBEN neben die Krempe -->
      <polygon points="-58,-44 0,2 -62,50" fill="#0a0d12" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="58,-44 0,2 62,50" fill="#0a0d12" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>

      <!-- Schwarzer Kopf -->
      <circle cx="0" cy="-30" r="31" fill="#0a0d12" stroke="#000000" stroke-width="6"/>

      <!-- Augen: schraege Almond-Slits, ROT gluehend -->
      <g id="evil-eyes" filter="url(#hck_eyeglow)">
        <g transform="rotate(16 -17 -34)">
          <ellipse cx="-17" cy="-34" rx="13.5" ry="5" fill="#ff0055">
            <animate attributeName="opacity" values="0.85;1;0.85" dur="2.8s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="-13" cy="-33" rx="7" ry="3" fill="#ff5277"/>
          <circle cx="-9" cy="-32.5" r="1.8" fill="#ffe1e8"/>
        </g>
        <g transform="rotate(-16 17 -34)">
          <ellipse cx="17" cy="-34" rx="13.5" ry="5" fill="#ff0055">
            <animate attributeName="opacity" values="0.85;1;0.85" dur="2.8s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="13" cy="-33" rx="7" ry="3" fill="#ff5277"/>
          <circle cx="9" cy="-32.5" r="1.8" fill="#ffe1e8"/>
        </g>
      </g>

      <!-- Fedora: Hutglocke mit leichter Einkerbung -->
      <path d="M -33,-58 L -36,-88 C -36,-97 -29,-101 -23,-100 C -9,-96 9,-96 23,-100 C 29,-101 36,-97 36,-88 L 33,-58 Z"
            fill="#0a0d12" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <!-- Fedora: breite Krempe mit leicht angehobenen Spitzen -->
      <path d="M -79,-54 C -66,-63 -36,-67 0,-67 C 36,-67 66,-63 79,-54 C 66,-48 -66,-48 -79,-54 Z"
            fill="#0a0d12" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
    </g>

    <!-- ===== LAPTOP DAVOR (wie Bild 2) ===== -->
    <g id="hacker-laptop" transform="translate(0, 72) rotate(-2) scale(0.95)">
      <!-- Deckel nach hinten gekippt -->
      <rect x="-38" y="-52" width="76" height="52" rx="6" fill="#0f1a14" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <rect x="-31" y="-45" width="62" height="38" rx="4" fill="url(#hck_screen)"/>
      <!-- Rotes Warn-Signal: blinkendes Warndreieck mittig -->
      <g id="laptop-warning" transform="translate(0, -26)">
        <ellipse cx="0" cy="1" rx="22" ry="15" fill="#ef4444" opacity="0.22" filter="url(#hck_soft)">
          <animate attributeName="opacity" values="0.12;0.34;0.12" dur="1.2s" repeatCount="indefinite"/>
        </ellipse>
        <path d="M 0,-11 L 13,10 L -13,10 Z" fill="#2b0808" stroke="#ef4444" stroke-width="3.5" stroke-linejoin="round">
          <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <rect x="-1.7" y="-5" width="3.4" height="8" rx="1.7" fill="#f87171">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="0" cy="6" r="1.9" fill="#f87171">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Mini JiMesh-Cube oben rechts im Screen -->
      <g transform="translate(24, -40) scale(0.04)">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#e879f9" stroke-width="16" stroke-linejoin="round"/>
        <polygon points="0,-140 122,-70 0,0 -122,-70" fill="#22d3ee"/>
        <polygon points="-122,-70 0,0 0,140 -122,70" fill="#c084fc"/>
        <polygon points="0,0 122,-70 122,70 0,140" fill="#0284c7"/>
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="16" stroke-linejoin="round"/>
      </g>
      <!-- Gruener Underglow des Deckels -->
      <ellipse cx="0" cy="2" rx="46" ry="9" fill="#10b981" opacity="0.16" filter="url(#hck_soft)"/>

      <!-- Tastatur-Basis -->
      <rect x="-46" y="-2" width="92" height="20" rx="5" fill="#1c2733" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      <rect x="-38" y="3" width="58" height="10" rx="2.5" fill="#0b1420"/>
      <rect x="-34" y="5" width="50" height="6" rx="2" fill="#10b981" opacity="0.18"/>
      <rect x="24" y="4" width="12" height="8" rx="2" fill="#10b981" opacity="0.5"/>
    </g>

    <!-- Schwarze Pfoten seitlich am Laptop -->
    <circle cx="-38" cy="88" r="9" fill="#151b24" stroke="#000000" stroke-width="6"/>
    <circle cx="38" cy="88" r="9" fill="#151b24" stroke="#000000" stroke-width="6"/>
    <ellipse cx="-28" cy="82" rx="4" ry="6" fill="#151b24" stroke="#000000" stroke-width="4"/>
    <ellipse cx="28" cy="82" rx="4" ry="6" fill="#151b24" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Comic Sparkles (rot/weiss) -->
  <g id="comic-sparkles">
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(86,120) scale(0.8)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ff0055" opacity="0.9" transform="translate(338,88) scale(1.0)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ff0055" opacity="0.7" transform="translate(342,296) scale(0.65)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(80,300) scale(0.55)"/>
  </g>
</g></g>
</svg>
