<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="woman1 portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(2.1) translate(-210,-192)">
  <defs>
    <linearGradient id="f_cubeTop" gradientUnits="userSpaceOnUse" x1="-120" y1="-140" x2="120" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="f_cubeLeft" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="0" y2="140">
      <stop offset="0%" stop-color="#e879f9"/><stop offset="45%" stop-color="#c084fc"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="f_cubeRight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="122" y2="140">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="f_extrude" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="122" y2="70">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="f_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="f_glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.28"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ht-woman" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#00d2ff" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Comic Halftone Patches -->
  <g opacity="0.45">
    <circle cx="332" cy="122" r="78" fill="url(#ht-woman)"/>
    <circle cx="92" cy="302" r="54" fill="url(#ht-woman)"/>
  </g>

  <g id="female-engineer" transform="translate(210, 212)">
    <!-- Kontakt-Schatten -->
    <ellipse cx="0" cy="170" rx="105" ry="14" fill="#000000" opacity="0.35"/>

    <!-- Screen Glow -->
    <polygon points="-70,110 70,110 92,-16 -92,-16" fill="url(#f_glow)"/>

    <!-- Zopf hinten rechts -->
    <path d="M 40,-18 C 76,-28 96,10 82,42 C 68,60 46,52 36,28 Z" fill="#1e1b2e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <rect x="46" y="0" width="10" height="16" rx="4" fill="#00d2ff" transform="rotate(24 51 8)"/>

    <!-- Top-Torso -->
    <path d="M -66,150 C -76,106 -50,72 -28,64 L 28,64 C 50,72 76,106 66,150 Z" fill="#131722" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -20,66 C -12,80 12,80 20,66 Z" fill="#202738" stroke="#000000" stroke-width="5"/>

    <!-- JiMesh Cube auf dem Shirt -->
    <g transform="translate(0, 114) scale(0.115)">
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
      <g transform="translate(18,20)"><polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="url(#f_extrude)"/></g>
      <polygon points="0,-140 122,-70 0,0 -122,-70" fill="url(#f_cubeTop)"/>
      <polygon points="-122,-70 0,0 0,140 -122,70" fill="url(#f_cubeLeft)"/>
      <polygon points="0,0 122,-70 122,70 0,140" fill="url(#f_cubeRight)"/>
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>
    </g>

    <!-- Ärmel -->
    <path d="M -60,84 C -66,108 -58,126 -38,138" fill="none" stroke="#131722" stroke-width="16" stroke-linecap="round"/>
    <path d="M 60,84 C 66,108 58,126 38,138" fill="none" stroke="#131722" stroke-width="16" stroke-linecap="round"/>

    <!-- Hals -->
    <rect x="-13" y="28" width="26" height="40" rx="8" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>

    <!-- Kopf -->
    <rect x="-44" y="-54" width="88" height="96" rx="30" fill="#fcd9ae" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="-44" cy="-8" r="10" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <circle cx="44" cy="-8" r="10" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <circle cx="-44" cy="4" r="6" fill="none" stroke="#00d2ff" stroke-width="3.5"/>
    <circle cx="44" cy="4" r="6" fill="none" stroke="#00d2ff" stroke-width="3.5"/>

    <!-- Seitenscheitel-Frisur mit Strähnen -->
    <path d="M -46,-16 C -50,-60 50,-60 46,-16 C 42,-8 38,4 38,14 C 32,-2 28,-20 0,-20 C -22,-20 -30,-2 -34,16 C -38,4 -42,-8 -46,-16 Z" fill="#1e1b2e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -34,-38 C -14,-48 20,-46 36,-34" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Comic-Gesicht -->
    <path d="M -24,-22 Q -17,-26 -10,-22" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10,-22 Q 17,-26 24,-22" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-17" cy="-9" rx="5.5" ry="6.5" fill="#ffffff"/>
    <ellipse cx="17" cy="-9" rx="5.5" ry="6.5" fill="#ffffff"/>
    <circle cx="-16.5" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="17.5" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="-18.5" cy="-11" r="1.5" fill="#ffffff"/>
    <circle cx="15.5" cy="-11" r="1.5" fill="#ffffff"/>
    <ellipse cx="-31" cy="4" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
    <ellipse cx="31" cy="4" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
    <path d="M -8,14 Q 0,22 8,14" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

    <!-- Laptop -->
    <g id="frontal-laptop" transform="translate(0, 118)">
      <polygon points="-64,-26 64,-26 74,36 -74,36" fill="url(#f_screen)" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="-58,-20 58,-20 67,30 -67,30" fill="#1e293b"/>
      <g transform="translate(0, 4) scale(0.12)">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
        <g transform="translate(18,20)"><polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="url(#f_extrude)"/></g>
        <polygon points="0,-140 122,-70 0,0 -122,-70" fill="url(#f_cubeTop)"/>
        <polygon points="-122,-70 0,0 0,140 -122,70" fill="url(#f_cubeLeft)"/>
        <polygon points="0,0 122,-70 122,70 0,140" fill="url(#f_cubeRight)"/>
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>
      </g>
      <polygon points="-76,34 76,34 90,52 -90,52" fill="#0b101c" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <line x1="-52" y1="40" x2="52" y2="40" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <rect x="-15" y="44" width="30" height="6" rx="2" fill="#1e293b"/>
    </g>

    <!-- Hände auf der Tastatur -->
    <circle cx="-32" cy="149" r="9.5" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <circle cx="32" cy="149" r="9.5" fill="#fcd9ae" stroke="#000000" stroke-width="6"/>
    <path d="M -38,146 L -27,146" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 27,146 L 38,146" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Comic Sparkles -->
  <g id="comic-sparkles">
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(86,120) scale(0.8)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#00d2ff" opacity="0.9" transform="translate(338,88) scale(1.0)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#00d2ff" opacity="0.7" transform="translate(342,296) scale(0.65)"/>
    <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(80,300) scale(0.55)"/>
  </g>
</g></g>
</svg>
