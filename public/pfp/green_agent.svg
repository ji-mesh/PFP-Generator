<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="green_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-180,-150)">
  <defs>
    <!-- Emerald Theme Cube Gradients -->
    <linearGradient id="cubeTop_eme" gradientUnits="userSpaceOnUse" x1="-120" y1="-140" x2="120" y2="0">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="1%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="cubeLeft_eme" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="0" y2="140">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="1%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="cubeRight_eme" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="122" y2="140">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="1%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="extrudeGrad_eme" gradientUnits="userSpaceOnUse" x1="-122" y1="-70" x2="122" y2="70">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="1%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rimFade_eme" gradientUnits="userSpaceOnUse" x1="-108" y1="-52" x2="26" y2="-86">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  <pattern id="ht-green" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#34d399" opacity="0.45"/>
</pattern>
</defs>

  <g id="comic-halftone" opacity="0.5"><circle cx="284" cy="96" r="88" fill="url(#ht-green)"/><circle cx="80" cy="304" r="62" fill="url(#ht-green)"/></g>

  <g id="good-agent-emerald" transform="translate(180, 185)">
    <!-- Kontakt-Schatten -->
    <ellipse cx="0" cy="175" rx="60" ry="12" fill="#000000" opacity="0.35"/>

    <!-- Antenne auf Kopf mit Signal-Beacon (Mint) -->
    <line x1="0" y1="-85" x2="0" y2="-125" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <path d="M 0,-118 C -18,-124 -20,-146 -2,-154 C 16,-148 16,-126 0,-118 Z" fill="#34d399" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <line x1="0" y1="-121" x2="0" y2="-148" stroke="#064e3b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="-141" r="5" fill="#ffffff" opacity="0.85"/>

    <!-- Ohren / Sensor Dials -->
    <rect x="-96" y="-55" width="22" height="38" rx="10" fill="#10b981" stroke="#000000" stroke-width="7.5" stroke-linejoin="round"/>
    <line x1="-85" y1="-46" x2="-85" y2="-26" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

    <rect x="74" y="-55" width="22" height="38" rx="10" fill="#10b981" stroke="#000000" stroke-width="7.5" stroke-linejoin="round"/>
    <line x1="85" y1="-46" x2="85" y2="-26" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

    <!-- Roboter-Kopf (Deep Obsidian Emerald) -->
    <rect x="-82" y="-92" width="164" height="112" rx="42" fill="#064e3b" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>

    <!-- Smaragdgrüner Stirnstreifen -->
    <path d="M -34 -92 L 34 -92 L 34 -52 L -34 -52 Z" fill="#10b981" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    <path d="M -32 -90 L 32 -90 L 32 -54 L -32 -54 Z" fill="#10b981"/>

    <!-- Bildschirm-Visor Glasfassung -->
    <rect x="-62" y="-54" width="124" height="60" rx="18" fill="#022c22" stroke="#000000" stroke-width="7.5"/>
    <rect x="-56" y="-48" width="112" height="48" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="4.5"/>

    <!-- Freundliche leuchtende Roboteraugen (Mint Glow) -->
    <circle cx="-28" cy="-24" r="11" fill="#a7f3d0"/>
    <circle cx="-31" cy="-27" r="3.5" fill="#ffffff"/>

    <circle cx="28" cy="-24" r="11" fill="#a7f3d0"/>
    <circle cx="25" cy="-27" r="3.5" fill="#ffffff"/>
    <circle cx="21" cy="-21" r="1.8" fill="#ffffff" opacity="0.85"/>
    <path d="M -40,-40 Q -28,-47 -16,-41" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 16,-41 Q 28,-47 40,-40" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -13,-9 Q 0,3 13,-9 Q 0,-4 -13,-9 Z" fill="#03251a" stroke="#34d399" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -5,-7.5 L 5,-7.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Arme / Greifer -->
    <path d="M -54,34 C -64,44 -68,60 -60,68 C -52,76 -46,64 -46,54" fill="#064e3b" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -66,54 C -72,60 -66,74 -56,70" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>

    <path d="M 54,34 C 64,44 68,60 60,68 C 52,76 46,64 46,54" fill="#064e3b" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 66,54 C 72,60 66,74 56,70" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Torso Körper -->
    <path d="M -48,22 C -62,56 -52,112 0,136 C 52,112 62,56 48,22 C 34,25 -34,25 -48,22 Z" 
          fill="#064e3b" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>

    <!-- Dunkelgrüne Seitenschattierung rechts -->
    <path d="M 0,136 C 36,120 54,82 48,22 C 34,25 24,32 20,46 C 14,70 18,108 0,136 Z" 
          fill="#022c22"/>

    <!-- Lichtreflex links -->
    <path d="M -38,36 C -46,58 -42,92 -20,116" fill="none" stroke="#6ee7b7" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

    <!-- ================= PROPORTIONAL VERKLEINERTER EMERALD CUBE AUF DER BRUST ================= -->
    <g id="chest-jimesh-cube-emerald" transform="translate(0, 80) scale(0.175)">
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.28) translate(0, 4)"/>

      <g transform="translate(18,20)">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="url(#extrudeGrad_eme)"/>
      </g>
      <g transform="translate(28,46)" opacity="0.75">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#08040f"/>
      </g>

      <polygon points="0,-140 122,-70 0,0 -122,-70" fill="url(#cubeTop_eme)"/>
      <polygon points="-122,-70 0,0 0,140 -122,70" fill="url(#cubeLeft_eme)"/>
      <polygon points="0,0 122,-70 122,70 0,140" fill="url(#cubeRight_eme)"/>

      <path d="M 0,0 L 122,-70 M 0,0 L -122,-70" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
      <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>

      <path d="M -108,-52 C -76,-80 -30,-95 12,-88" fill="none" stroke="url(#rimFade_eme)" stroke-width="10" stroke-linecap="round"/>

      <g fill="#ffffff" opacity="0.8">
        <circle cx="-24" cy="-96" r="5"/><circle cx="4" cy="-90" r="4.5"/><circle cx="32" cy="-84" r="4"/>
        <circle cx="-10" cy="-110" r="4"/><circle cx="18" cy="-104" r="3.5"/><circle cx="46" cy="-98" r="3.2"/>
      </g>
    </g>
  </g>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(72,112) scale(0.8)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#34d399" opacity="0.9" transform="translate(298,64) scale(1.05)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#34d399" opacity="0.75" transform="translate(305,296) scale(0.7)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(68,300) scale(0.55)"/>
</g>
<g stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="215" y1="34" x2="238" y2="18"/>
  <line x1="222" y1="50" x2="248" y2="38"/>
  <line x1="226" y1="66" x2="252" y2="58"/>
</g>
</g></g>
</svg>
