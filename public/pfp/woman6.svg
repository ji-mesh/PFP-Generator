<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="woman6 avatar, blazer with braid, circular crop">
  <defs>
    <clipPath id="w6Clip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="w6Glow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="w6Dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#w6Clip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#w6Glow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#w6Dots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#w6Dots)"/>
    </g>
    <g id="w6-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- braid (back of shoulder) -->
      <ellipse cx="50" cy="40" rx="12" ry="13" fill="#362a55" stroke="#000000" stroke-width="6"/>
      <ellipse cx="54" cy="64" rx="11" ry="12" fill="#362a55" stroke="#000000" stroke-width="6"/>
      <ellipse cx="56" cy="88" rx="10" ry="11" fill="#362a55" stroke="#000000" stroke-width="6"/>
      <ellipse cx="54" cy="110" rx="9" ry="10" fill="#362a55" stroke="#000000" stroke-width="6"/>
      <circle cx="52" cy="124" r="6" fill="#22d3ee" stroke="#000000" stroke-width="4"/>
      <!-- torso blazer -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#241b3a" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- shirt V + lapels -->
      <path d="M -20,66 L 0,92 L 20,66 Z" fill="#e2e8f0" stroke="#000000" stroke-width="5"/>
      <path d="M -24,66 L -6,74 L -18,88 Z" fill="#362a55" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 24,66 L 6,74 L 18,88 Z" fill="#362a55" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="18" cy="96" r="5" fill="#c084fc" stroke="#000000" stroke-width="3"/>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#c68863" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#c68863" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#c68863" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#c68863" stroke="#000000" stroke-width="6"/>
      <!-- earrings -->
      <circle cx="-46" cy="-26" r="4" fill="#22d3ee" stroke="#000000" stroke-width="3"/>
      <circle cx="46" cy="-26" r="4" fill="#22d3ee" stroke="#000000" stroke-width="3"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- hair cap, side part -->
      <path d="M -46,-56 C -48,-116 48,-116 46,-56 C 38,-78 20,-84 0,-84 C -20,-84 -38,-78 -46,-56 Z" fill="#362a55" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <!-- flower pin -->
      <circle cx="-34" cy="-66" r="5" fill="#c084fc" stroke="#000000" stroke-width="3"/>
      <circle cx="-42" cy="-60" r="5" fill="#c084fc" stroke="#000000" stroke-width="3"/>
      <circle cx="-38" cy="-70" r="5" fill="#e879f9" stroke="#000000" stroke-width="3"/>
      <circle cx="-38" cy="-65" r="3" fill="#22d3ee"/>
      </g>
    </g>
    <g id="w6-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
