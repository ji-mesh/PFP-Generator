<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="browser_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-207)">
  <defs>
    <radialGradient id="br-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2a3b"/><stop offset="60%" stop-color="#071724"/><stop offset="100%" stop-color="#020910"/>
    </radialGradient>
    <linearGradient id="br-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="br-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <pattern id="ht-browser" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.45"/>
</pattern>
</defs>
  <rect width="500" height="500" rx="40" fill="url(#br-bg)" stroke="#155e75" stroke-width="2"/>
  <circle cx="250" cy="230" r="160" fill="#0891b2" opacity="0.15" filter="url(#br-glow)"/>
  
  <g id="comic-halftone" opacity="0.5"><circle cx="384" cy="136" r="112" fill="url(#ht-browser)"/><circle cx="96" cy="334" r="76" fill="url(#ht-browser)"/></g>

  <g transform="translate(250, 240) scale(0.95)">
    <ellipse cx="0" cy="185" rx="90" ry="18" fill="#000000" opacity="0.55"/>
    <!-- Browser Dual Sensor Antennas -->
    <polygon points="-35,-95 -58,-145 -25,-105" fill="#22d3ee" stroke="#000000" stroke-width="8" filter="url(#br-glow)"/>
    <polygon points="35,-95 58,-145 25,-105" fill="#22d3ee" stroke="#000000" stroke-width="8" filter="url(#br-glow)"/>

    <!-- Head &amp; Ears -->
    <rect x="-96" y="-55" width="24" height="42" rx="10" fill="#0891b2" stroke="#000000" stroke-width="8.5"/>
    <rect x="72" y="-55" width="24" height="42" rx="10" fill="#0891b2" stroke="#000000" stroke-width="8.5"/>
    <rect x="-86" y="-95" width="172" height="120" rx="38" fill="url(#br-cyan)" stroke="#000000" stroke-width="11"/>
    <rect x="-86" y="-95" width="172" height="24" rx="16" fill="#083344" stroke="#000000" stroke-width="6"/>
    <circle cx="-70" cy="-83" r="3.5" fill="#ef4444"/>
    <circle cx="-58" cy="-83" r="3.5" fill="#f59e0b"/>
    <circle cx="-46" cy="-83" r="3.5" fill="#10b981"/>
    <rect x="-8" y="-88" width="58" height="10" rx="5" fill="#164e63"/>
    <polygon points="42,-88 50,-83 42,-78 34,-83" fill="#67e8f9"/>

    <!-- Browser Window Face Visor -->
    <rect x="-65" y="-55" width="130" height="62" rx="14" fill="#04202e" stroke="#000000" stroke-width="8"/>
    <!-- Browser Top Bar inside visor -->
    <rect x="-58" y="-48" width="116" height="14" rx="4" fill="#083344"/>
    <circle cx="-48" cy="-41" r="3" fill="#ef4444"/>
    <circle cx="-38" cy="-41" r="3" fill="#f59e0b"/>
    <circle cx="-28" cy="-41" r="3" fill="#10b981"/>
    <!-- Web Cursor Navigation Eyes -->
    <polygon points="-24,-24 -14,-10 -19,-10 -22,-3" fill="#22d3ee" filter="url(#br-glow)"/>
    <polygon points="18,-24 28,-10 23,-10 20,-3" fill="#22d3ee" filter="url(#br-glow)"/>

    <!-- Body &amp; Playwright Web Token -->
    <path d="M -52,22 C -66,58 -56,118 0,144 C 56,118 66,58 52,22 Z" fill="url(#br-cyan)" stroke="#000000" stroke-width="11"/>
    <polygon points="-22,148 -28,166 -12,158" fill="#22d3ee" opacity="0.85" filter="url(#br-glow)"/>
    <polygon points="22,148 28,166 12,158" fill="#22d3ee" opacity="0.85" filter="url(#br-glow)"/>
    <rect x="-34" y="65" width="68" height="30" rx="8" fill="#083344" stroke="#000000" stroke-width="4"/>
    <text x="0" y="85" fill="#67e8f9" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">HTTP:200</text>
  </g>
  <rect x="92" y="436" width="317" height="31" rx="15.5" fill="#0b111c" opacity="0.88" stroke="#22d3ee" stroke-width="2.5" filter="url(#br-glow)"/>
  <text x="250" y="455" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">BROWSER AGENT // WEB RPA</text>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(118,148) scale(0.9)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.9" transform="translate(392,112) scale(1.15)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.75" transform="translate(402,318) scale(0.75)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(103,332) scale(0.6)"/>
</g>
<g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="292" y1="70" x2="316" y2="52"/>
  <line x1="300" y1="86" x2="326" y2="72"/>
  <line x1="304" y1="104" x2="330" y2="94"/>
</g>
</g></g>
</svg>
