<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="figma_agent portrait profile picture, circular crop">
  <defs>
    <clipPath id="pfpClip"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#pfpClip)"><g transform="translate(200,176) scale(1.5) translate(-250,-207)">
  <defs>
    <radialGradient id="d-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#092d21"/><stop offset="60%" stop-color="#041a12"/><stop offset="100%" stop-color="#010a07"/>
    </radialGradient>
    <linearGradient id="d-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <pattern id="ht-figma" width="13" height="13" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="2" fill="#34d399" opacity="0.45"/>
</pattern>
</defs>
  <rect width="500" height="500" rx="40" fill="url(#d-bg)" stroke="#10b981" stroke-width="2"/>
  <circle cx="250" cy="230" r="160" fill="#10b981" opacity="0.16" filter="url(#d-glow)"/>

  <g id="comic-halftone" opacity="0.5"><circle cx="384" cy="136" r="112" fill="url(#ht-figma)"/><circle cx="96" cy="334" r="76" fill="url(#ht-figma)"/></g>

  <g transform="translate(250, 240) scale(0.95)">
    <ellipse cx="0" cy="185" rx="90" ry="18" fill="#000000" opacity="0.55"/>
    
    <!-- Design Compass Beacon -->
    <line x1="0" y1="-85" x2="0" y2="-140" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-155" r="24" fill="#34d399" stroke="#000000" stroke-width="9" filter="url(#d-glow)"/>
    <circle cx="-7" cy="-162" r="6" fill="#ffffff" opacity="0.9"/>
    <polygon points="50,-118 61,-107 50,-96 39,-107" fill="#e879f9" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="50" cy="-107" r="3" fill="#ffffff"/>

    <!-- Head &amp; Ears -->
    <circle cx="-84" cy="-34" r="15" fill="#059669" stroke="#000000" stroke-width="8.5"/>
    <circle cx="-84" cy="-34" r="4" fill="#a7f3d0"/>
    <circle cx="84" cy="-34" r="15" fill="#059669" stroke="#000000" stroke-width="8.5"/>
    <circle cx="84" cy="-34" r="4" fill="#a7f3d0"/>
    <rect x="-86" y="-95" width="172" height="120" rx="60" fill="url(#d-emerald)" stroke="#000000" stroke-width="11"/>
    <path d="M -36 -95 L 36 -95 L 36 -55 L -36 -55 Z" fill="#6ee7b7" stroke="#000000" stroke-width="7.5"/>

    <!-- Precision Crosshair / Pixel Grid Eyes -->
    <rect x="-65" y="-55" width="130" height="62" rx="18" fill="#042017" stroke="#000000" stroke-width="8"/>
    <circle cx="-28" cy="-24" r="12" fill="#a7f3d0" filter="url(#d-glow)"/>
    <circle cx="28" cy="-24" r="12" fill="#a7f3d0" filter="url(#d-glow)"/>
    <circle cx="-28" cy="-24" r="4" fill="#064e3b"/><circle cx="28" cy="-24" r="4" fill="#064e3b"/>
    <circle cx="-32" cy="-29" r="3.5" fill="#ffffff" opacity="0.95"/><circle cx="-23" cy="-20" r="2" fill="#ffffff" opacity="0.8"/><circle cx="24" cy="-29" r="3.5" fill="#ffffff" opacity="0.95"/><circle cx="33" cy="-20" r="2" fill="#ffffff" opacity="0.8"/>
    <path d="M -42,-41 Q -29,-48 -16,-42" fill="none" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 16,-42 Q 29,-48 42,-41" fill="none" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -13,-9 Q 0,3 13,-9 Q 0,-4 -13,-9 Z" fill="#042017" stroke="#a7f3d0" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -5,-7.5 L 5,-7.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Torso with Color Palette / Pen Tool Emblem -->
    <path d="M -52,22 C -66,58 -56,118 0,144 C 56,118 66,58 52,22 Z" fill="url(#d-emerald)" stroke="#000000" stroke-width="11"/>
    <g transform="translate(0, 80)">
      <circle cx="-22" cy="0" r="10" fill="#67e8f9"/>
      <circle cx="0" cy="-15" r="10" fill="#e879f9"/>
      <circle cx="22" cy="0" r="10" fill="#f59e0b"/>
      <circle cx="0" cy="15" r="10" fill="#34d399"/>
    </g>
  </g>
  <rect x="75" y="436" width="351" height="31" rx="15.5" fill="#0b111c" opacity="0.88" stroke="#34d399" stroke-width="2.5" filter="url(#d-glow)"/>
  <text x="250" y="455" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">DESIGN AGENT // FIGMA &amp; SVG</text>
<g id="comic-sparkles">
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.95" transform="translate(118,148) scale(0.9)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#34d399" opacity="0.9" transform="translate(392,112) scale(1.15)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#34d399" opacity="0.75" transform="translate(402,318) scale(0.75)"/>
  <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.7" transform="translate(103,332) scale(0.6)"/>
</g>
<g stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5">
  <line x1="292" y1="70" x2="316" y2="52"/>
  <line x1="300" y1="86" x2="326" y2="72"/>
  <line x1="304" y1="104" x2="330" y2="94"/>
</g>
</g></g>
</svg>
